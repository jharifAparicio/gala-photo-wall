version: '3.8'

services:
  # Servicio 1: Astro SSR App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gala_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=4321
      - HOST=0.0.0.0
      - NODE_ENV=production
    networks:
      - gala-net
    # No mapea puertos al exterior; solo accesible por Nginx

  # Servicio 2: Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: gala_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/www/certbot
    depends_on:
      - app
    networks:
      - gala-net

  # Servicio 3: Certbot para renovación automática
  certbot:
    image: certbot/certbot
    container_name: gala_certbot
    restart: unless-stopped
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  gala-net:
    driver: bridge

volumes:
  certbot_etc:
  certbot_var: