# 1. Redirección forzada de HTTP a HTTPS y validación de Certbot
server {
    listen 80;
    listen [::]:80;
    server_name gala-sucre.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor Seguro HTTPS con Proxy Inverso
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name TU_DOMINIO.duckdns.org;

    # Certificados gestionados por Certbot
    ssl_certificate /etc/letsencrypt/live/TU_DOMINIO.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TU_DOMINIO.duckdns.org/privkey.pem;

    # Parámetros SSL recomendados
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # Límite de carga de imágenes (evita 413 Request Entity Too Large si suben directo)
    client_max_body_size 25M;

    # Proxy hacia el contenedor interno de Astro
    location / {
        proxy_pass http://app:4321;
        proxy_http_version 1.1;
        
        # Cabeceras requeridas para WebSockets y Host original
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }
}